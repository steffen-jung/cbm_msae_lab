[project]
name = "cbm-msae-lab"
version = "0.1.0"
description = "A flexible, Hydra-configurable research codebase for training concept sparse autoencoders (Matryoshka SAE) on vision encoder features."
readme = "README.md"
authors = [
    { name = "Fabian Roesch", email = "fabi.roesch01@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dictionary-learning>=0.1.0",
    "einops>=0.8.2",
    "hydra-core>=1.3.6",
    "numpy>=2.4.6",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "timm>=1.0.29",
    "torchmetrics>=1.9.0",
    "tqdm>=4.67.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
]

[tool.ruff]
line-length = 120  # generous on purpose: this codebase favors descriptive trailing shape comments over wrapping them
