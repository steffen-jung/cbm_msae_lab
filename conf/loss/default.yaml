# Every loss is always constructed; a weight of 0.0 disables it and skips its
# compute() call entirely (see ComposableLossTrainer.loss()). Mix and match freely,
# e.g. to reproduce CFM exactly: only reconstruction + auxk nonzero (the default below).
defaults:
  - base_default

reconstruction:
  weight: 1.0

auxk:
  weight: 0.03125  # CFM's default auxk_alpha = 1/32

scale_spatial:
  weight: 0.0  # set > 0 to enable the user's scale/spatial loss
  scales: [1, 2, 7, 14]
  scale_weights: null  # null -> uniform 1/len(scales)
  alpha: 1.0
  b_min: 1

group_sparsity:
  weight: 0.0  # S2AE group sparsity loss (arXiv:2607.08605, Eq. 9)
  grouping: tile  # "tile" (fixed grid, default) | "attention" | "feature" (both need a group-label cache)
  tile_size: 2

exclusivity:
  weight: 0.0  # S2AE exclusive sparsity loss (arXiv:2607.08605, Eq. 10)
  grouping: tile  # "tile" | "attention" | "feature"
  tile_size: 2

participation_ratio:
  weight: 0.0  # PR loss: effective number of regions per feature (shrinkage-free)
  grouping: tile  # "tile" | "attention" | "feature"
  tile_size: 2
  level_weights: null  # null -> uniform 1/L over the Matryoshka levels

# A hard selection rule, not a loss -- hence `enabled` instead of `weight`.
# Intersects with BatchTopK (never revives what BatchTopK dropped) and applies
# during training only; inference keeps the learned BatchTopK threshold.
group_topk:
  enabled: false
  grouping: tile  # "tile" | "attention" | "feature"
  tile_size: 2
  k_group: 48  # total features allowed per region, split proportionally across levels
  k_per_level: null  # explicit override of that split

# Only used when a grouping above is "attention"
# or "feature" -- shared by both clustering methods (see AttentionGroupingConfig).
# Defaults match S2AE's own repo (github.com/liaoweiduo/s2ae).
attention_grouping:
  n_clusters: 20
  spatial_coeff: 0.02
