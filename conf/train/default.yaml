defaults:
  - base_default

batch_size: 64
num_workers: 4
epochs: 200  # hard cap; early_stopping below almost always stops first
device: cuda
checkpoint_dir: outputs/checkpoints
checkpoint_every_n_epochs: 5
log_every_n_steps: 50

cache:
  mode: live  # "live" | "cache_encoder"
  dir: cache

eval:
  every_n_epochs: 5
  enable_expensive_metrics: false  # Monosemanticity/Tversky-MS need a full validation pass
  max_eval_samples: 2000

# Stops once val/mse stops improving. patience counts eval checks (every
# eval.every_n_epochs epochs), not epochs -- 6 checks * 5 epochs = 30 epochs
# without a >= min_delta relative improvement before stopping.
early_stopping:
  enabled: true
  patience: 6
  min_delta: 0.001

wandb:
  project: cbm-msae-lab
  mode: online  # "online" | "offline" | "disabled"
  run_name: null
