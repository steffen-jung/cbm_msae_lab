defaults:
  - base_default

batch_size: 64
num_workers: 4
epochs: 200  # hard cap; early_stopping below almost always stops first
device: cuda
checkpoint_dir: outputs/checkpoints
metrics_jsonl: null  # null -> <checkpoint_dir>/metrics.jsonl; always written locally
checkpoint_every_n_epochs: 5
log_every_n_steps: 50

cache:
  mode: live  # "live" | "cache_encoder"
  dir: cache

eval:
  every_n_epochs: 5
  batch_size: 8  # smaller than train.batch_size; eval peak scales with B*P*dict_size
  enable_expensive_metrics: true  # Monosemanticity/Tversky-MS need a full validation pass
  max_eval_samples: 2000
  # "auto" measures region consistency on whatever patch clusters the run's own
  # structural loss trains with -- see EvalConfig / grouping.resolve_region_grouping.
  # Force "tile"/"attention"/"feature" to compare every ablation arm against one
  # fixed partition instead.
  region_grouping: auto  # "auto" | "tile" | "attention" | "feature"
  region_tile_size: 2

# Stops once the monitored metric stops improving. patience counts eval checks
# (every eval.every_n_epochs epochs), not epochs -- 6 checks * 5 epochs = 30
# epochs without a >= min_delta relative improvement before stopping.
# `monitor` also selects best.pt. val/fvu (fraction of variance unexplained) is
# preferred over val/mse because it is scale-invariant: it measures how well the
# SAE reconstructs, not how small the thing being reconstructed happens to be.
early_stopping:
  enabled: true
  monitor: val/fvu  # any key run_eval() returns, lower-is-better
  patience: 6
  min_delta: 0.001

wandb:
  project: cbm-msae-lab
  mode: online  # "online" | "offline" | "disabled"
  run_name: null
